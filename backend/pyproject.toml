[project]
name = "miaoban-backend"
version = "0.2.0"
description = "Persistent virtual pet companion with bounded personal memory"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.36,<1",
  "sqlalchemy[asyncio]>=2.0.40,<2.1", "asyncpg>=0.30,<1", "alembic>=1.15,<2",
  "pgvector>=0.4,<1", "openai>=2,<3", "openai-agents>=0.4,<1",
  "pydantic-settings>=2.8,<3", "pwdlib[argon2]>=0.2,<1",
  "tiktoken>=0.9,<1", "jieba>=0.42,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
